substitutions:
  buzzer_pin: A0
  i2s_bclk_pin: A1
  i2s_din_pin: "${buzzer_pin}"
  i2s_lrclk_pin: A5
  pir_pin: A4
  rgb_led_pin: GPIO7
  rgb_led_type: GRB
  rgb_led_order: GRB
  sen0395_io_pin: A2
  uart_rx_pin: GPIO20
  uart_tx_pin: GPIO21

esphome:
  on_boot:
    priority: 600  # Run very early in boot sequence
    then:
      - lambda: |-
          // Force release GPIO20/21 from USB control
          gpio_reset_pin(${uart_rx_pin});
          gpio_reset_pin(${uart_tx_pin});
          
          // Configure as UART pins
          gpio_set_direction(${uart_rx_pin}, GPIO_MODE_OUTPUT);
          gpio_set_direction(${uart_tx_pin}, GPIO_MODE_INPUT);
          gpio_set_pull_mode(${uart_tx_pin}, GPIO_PULLUP_ONLY);
          
          // Disable USB serial JTAG pad
          USB_SERIAL_JTAG.conf0.usb_pad_enable = 0;
  platformio_options:
    board_build.extra_flags:
      - "-DARDUINO_USB_CDC_ON_BOOT=0"
    board_build.flash_mode: dio

esp32:
  board: lolin_c3_mini
  variant: ESP32C3
  framework:
    type: esp-idf

wifi:
  output_power: 8.5dBm

i2c:
  sda: GPIO8
  scl: GPIO10

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
